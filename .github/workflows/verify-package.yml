name: Verify immutable replication package
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen bytes and compile scientific entry points
        run: |
          python -B scripts/prepare_replication.py --verify-only
          python -B scripts/verify_publication_package.py
